name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "migration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, TypeScript, build e higiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      VITE_APP_ID: ci-app
      OAUTH_SERVER_URL: http://127.0.0.1
      OWNER_OPEN_ID: ci-owner
      BUILT_IN_FORGE_API_URL: http://127.0.0.1
      BUILT_IN_FORGE_API_KEY: ci-only-key
      RDSTATION_CALLBACK_BASE_URL: https://ci.example.invalid/
      VITE_APP_TITLE: Medsystems - Gerencial

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar higiene do repositório
        run: pnpm verify:repo

      - name: Executar testes determinísticos
        run: pnpm test:ci

      - name: Verificar TypeScript
        run: pnpm check

      - name: Gerar build de produção
        run: pnpm build
